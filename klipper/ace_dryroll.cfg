# ACE 2 Pro — spool rotation during drying ("rotisserie")
#
# Anycubic's own auto_roll (DryingRequest field 3) nudges 5 mm at mode 1 every ~4 minutes:
# it barely rotates the spool and slowly walks the filament backwards. This does the job
# properly, with two modes selectable per lane.
#
#   sweep : lane is THREADED (slot reads 'ready'). Rolls back and forth on the ACE side of a
#           sensor-defined park position, so it never moves toward the hub. Net position is
#           preserved and there is nothing to tie.
#
#   spin  : lane is NOT THREADED (slot reads 'empty', tip secured to the spool by the user).
#           Rotates continuously in one direction.
#
#   off   : excluded.
#
# GUARDS ARE MECHANICAL, NOT ADVISORY. 'spin' refuses unless the slot reads 'empty', so
# continuous winding can never run on a fed lane. 'sweep' refuses unless it reads 'ready'.
# Neither runs on the loaded tool, on a lane positioned at the toolhead, or during a print.
#
# SWEEP NEEDS A DATUM, AND EARNS IT ITSELF. A spool may not be moved from a position we cannot
# state, so a sweep lane is inert until its park is sensor-defined by ACE_LANE_NORMALIZE (feed
# to the hub switch, back off park_offset_mm). Rather than failing, the roller CHECKS whether
# it is calibrated; if not, whether it can calibrate right now -- printer idle, hub clear, no
# pending operation, slot ready. If it can, it calibrates on the spot and starts moving. If it
# cannot, it says what it is waiting for and retries. One lane per pass: the hub is a
# single-occupancy shared resource.
#
# 'spin' needs no datum: nothing is threaded, so there is no position to know.
#
# WHY 'spin' WORKS (proven on hardware 2026-08-29). The spool and the feed gears share one
# motor through a permanent coupling, so commanding a rollback on a lane with nothing in the
# gears still turns the spool. GET_FEED_INFO separates the two: with no filament, 299mm
# commanded gave magnitude_mm 299 (the motor) and moved_mm 0 (the filament). No filament is
# consumed and none is at risk, because none is in the path.
#
# Requires: ace_raw_feed.py (ACE_RAW_FEED) and the Kobra-S1/ACEPRO driver with
# ace_path_calibrate (ACE_LANE_NORMALIZE) and ace_preload_guard.

[gcode_macro _ACE_DRYROLL_VARS]
description: Storage only. Tunables for the drying spool roller.
variable_leg: 150             # mm of filament per tick (one leg of the sweep)
variable_speed: 15            # mm/s - slow and constant is the point
variable_margin: 100          # mm kept clear of the measured gate boundary
variable_step: 25             # mm per ACE_LANE_RANGE probe step
variable_cap: 1200            # mm - range probe gives up beyond this
variable_default_range: 600   # mm assumed after calibration, until ACE_LANE_RANGE refines it
variable_leg_printing: 50     # mm per leg while a print is running - shorter, so the ACE is
                              # never busy long enough to collide with a toolchange
variable_interval: 300        # seconds between rolling ticks
variable_retry: 60            # seconds between retries while waiting to calibrate
variable_allow_printing: 0    # DO NOT roll during a print. An ACE_RAW_FEED mid-print blocks the
                              # Klipper motion queue for the length of the RS-485 transaction: a
                              # 50mm leg at 15mm/s visibly stalled the toolhead on layer 2
                              # (2026-08-30). Rolling idle lanes while printing is only safe once
                              # the ACE command path is made non-blocking. Until then, 0.
gcode:

# --------------------------------------------------------------------------------------
# Print integration
# --------------------------------------------------------------------------------------
# Called from PRINT_START (after ACE_PREFLIGHT, so slicer usage is known) while the printer is
# still homing and soaking. Lanes the job will USE stop rolling and are re-parked against the
# hub so they start from a sensor-defined datum. Lanes the job does NOT use keep roasting.
#
# If usage cannot be determined, EVERY lane is reserved and parked. Guessing which lanes a job
# needs is not a safe failure mode; parking one that did not need it costs nothing.

[gcode_macro ACE_DRYROLL_PREPARE]
description: PRINT_START hook. Park the lanes this job uses; leave the rest rolling. [TOOLS=0,2]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set usage = printer['ace_slicer_usage'].per_tool_mm|default([]) %}
    {% set res = [0,0,0,0] %}
    {% set ns = namespace(src='', known=false) %}

    {% if params.TOOLS is defined %}
        {% for tok in params.TOOLS.split(',') %}
            {% if tok|trim|length and tok|trim|int >= 0 and tok|trim|int < 4 %}
                {% set _ = res.__setitem__(tok|trim|int, 1) %}
            {% endif %}
        {% endfor %}
        {% set ns.src = 'TOOLS=' ~ params.TOOLS %}
        {% set ns.known = true %}
    {% elif usage|length > 0 %}
        {% for t in range(4) %}
            {% if t < usage|length and usage[t]|float > 0 %}
                {% set _ = res.__setitem__(t, 1) %}
            {% endif %}
        {% endfor %}
        {% set ns.src = 'slicer usage ' ~ usage %}
        {% set ns.known = true %}
    {% endif %}

    {% if not ns.known %}
        # Worst case: we do not know what the job needs, so treat every lane as needed.
        {% set res = [1,1,1,1] %}
        {% set ns.src = 'UNKNOWN usage - reserving every lane' %}
    {% endif %}

    SAVE_VARIABLE VARIABLE=ace_dryroll_reserved VALUE="{res}"
    RESPOND MSG="[DRYROLL] print prepare: reserved={res} ({ns.src})"
    _ACE_DRYROLL_PREPARE_PARK

[gcode_macro _ACE_DRYROLL_PREPARE_PARK]
description: Internal. Re-park every reserved lane that drifted off its datum.
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set res = sv.ace_dryroll_reserved|default([0,0,0,0]) %}
    {% set pos = sv.ace_dryroll_pos|default([0,0,0,0]) %}
    {% set dat = sv.ace_dryroll_datum|default([0,0,0,0]) %}
    {% set hub = printer['filament_switch_sensor hub_detect'].filament_detected|default(true) %}
    {% set ns = namespace(need=[]) %}
    {% for t in range(4) %}
        {% if res[t]|int == 1 and printer['ace_instance_0'].slots[t].status|default('') == 'ready'
              and (pos[t]|int != 0 or dat[t]|int == 0) %}
            {% set ns.need = ns.need + [t] %}
        {% endif %}
    {% endfor %}

    {% if ns.need|length == 0 %}
        RESPOND MSG="[DRYROLL] every reserved lane is already at its datum - nothing to park"
    {% elif hub %}
        # Refuse rather than let the job start from an unknown position: a lane up to 600mm off
        # its datum under-feeds the load by that much.
        { action_raise_error("ACE_DRYROLL_PREPARE: lanes " ~ ns.need ~ " are off their park datum and the hub is occupied - clear the hub, then retry. Starting now would under-feed the load.") }
    {% else %}
        RESPOND MSG="[DRYROLL] re-parking reserved lanes {ns.need} against the hub"
        {% for t in ns.need %}
            ACE_LANE_NORMALIZE T={t}
            _ACE_DRYROLL_MARK T={t}
        {% endfor %}
        RESPOND MSG="[DRYROLL] reserved lanes parked and ready"
    {% endif %}

[gcode_macro ACE_DRYROLL_RELEASE]
description: PRINT_END / CANCEL hook. Clear print reservations so every lane may roll again.
gcode:
    SAVE_VARIABLE VARIABLE=ace_dryroll_reserved VALUE="[0, 0, 0, 0]"
    RESPOND MSG="[DRYROLL] print reservations cleared"


[gcode_macro ACE_DRYROLL_MODE]
description: Set the drying-roll mode for a lane. T=<0-3> MODE=off|sweep|spin
gcode:
    {% set t = params.T|int %}
    {% set m = params.MODE|default('off')|lower %}
    {% if t < 0 or t > 3 %}
        RESPOND TYPE=error MSG="ACE_DRYROLL_MODE: T must be 0-3"
    {% elif m not in ['off','sweep','spin'] %}
        RESPOND TYPE=error MSG="ACE_DRYROLL_MODE: MODE must be off, sweep or spin"
    {% else %}
        {% set modes = printer.save_variables.variables.ace_dryroll_mode|default(['off','off','off','off']) %}
        {% set _ = modes.__setitem__(t, m) %}
        SAVE_VARIABLE VARIABLE=ace_dryroll_mode VALUE="{modes}"
        {% set try = printer.save_variables.variables.ace_dryroll_try|default([0,0,0,0]) %}
        {% set _ = try.__setitem__(t, 0) %}
        SAVE_VARIABLE VARIABLE=ace_dryroll_try VALUE="{try}"
        RESPOND MSG="[DRYROLL] T{t} mode = {m}"
        {% if m == 'sweep' and (printer.save_variables.variables.ace_dryroll_datum|default([0,0,0,0]))[t]|int == 0 %}
            RESPOND MSG="[DRYROLL] T{t} not calibrated yet - the roller will do it when the hub is free"
        {% endif %}
    {% endif %}

[gcode_macro ACE_DRYROLL_STATUS]
description: Show the drying-roll configuration and state
gcode:
    {% set v = printer.save_variables.variables %}
    {% set modes = v.ace_dryroll_mode|default(['off','off','off','off']) %}
    {% set rng = v.ace_dryroll_range|default([0,0,0,0]) %}
    {% set pos = v.ace_dryroll_pos|default([0,0,0,0]) %}
    {% set dir = v.ace_dryroll_dir|default([1,1,1,1]) %}
    {% set dat = v.ace_dryroll_datum|default([0,0,0,0]) %}
    {% set lanepos = v.ace_lane_pos|default(['','','','']) %}
    {% set act = v.ace_dryroll_active|default(0)|int %}
    {% set hub = printer['filament_switch_sensor hub_detect'].filament_detected|default(true) %}
    RESPOND MSG="[DRYROLL] {'RUNNING' if act else 'stopped'} - hub {'OCCUPIED' if hub else 'free'}, printer {printer.print_stats.state}"
    {% for t in range(4) %}
        {% set st = printer['ace_instance_0'].slots[t].status|default('?') %}
        RESPOND MSG="  T{t} mode={modes[t]} slot={st} lane={lanepos[t]} cal={'yes' if dat[t]|int else 'NO'} range={rng[t]}mm pos={pos[t]}mm dir={dir[t]}"
    {% endfor %}

[gcode_macro ACE_DRYROLL_START]
description: Begin periodic spool rotation. Calibrates any lane that needs it, when it can.
gcode:
    SAVE_VARIABLE VARIABLE=ace_dryroll_active VALUE=1
    RESPOND MSG="[DRYROLL] started"
    UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION=1

[gcode_macro ACE_DRYROLL_STOP]
description: Stop periodic spool rotation
gcode:
    SAVE_VARIABLE VARIABLE=ace_dryroll_active VALUE=0
    UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION=0
    RESPOND MSG="[DRYROLL] stopped"

# --------------------------------------------------------------------------------------
# The tick: calibrate what needs it, then roll what is ready
# --------------------------------------------------------------------------------------

[gcode_macro _ACE_DRYROLL_TICK]
description: Internal. Audits state, then hands off to the body.
gcode:
    # Two invocations on purpose. Klipper renders a macro completely before executing any of
    # it, so reading ACE_AUDIT's result inside this same render would see the PREVIOUS pass's
    # value. The body is a separate macro call, so it renders after the audit has run.
    ACE_AUDIT QUIET=1
    _ACE_DRYROLL_BODY

[gcode_macro _ACE_DRYROLL_BODY]
description: Internal. Calibrates one lane per pass if needed, otherwise rolls every eligible lane.
gcode:
    {% set v = printer['gcode_macro _ACE_DRYROLL_VARS'] %}
    {% set sv = printer.save_variables.variables %}
    {% set modes = sv.ace_dryroll_mode|default(['off','off','off','off']) %}
    {% set rng = sv.ace_dryroll_range|default([0,0,0,0]) %}
    {% set pos = sv.ace_dryroll_pos|default([0,0,0,0]) %}
    {% set dir = sv.ace_dryroll_dir|default([1,1,1,1]) %}
    {% set dat = sv.ace_dryroll_datum|default([0,0,0,0]) %}
    {% set res = sv.ace_dryroll_reserved|default([0,0,0,0]) %}
    {% set try = sv.ace_dryroll_try|default([0,0,0,0]) %}
    {% set lanepos = sv.ace_lane_pos|default(['','','','']) %}
    {% set printing = printer.print_stats.state == 'printing' %}
    {% set cur = printer['ace'].current_index|default(-1)|int %}
    {% set dev = printer['ace_instance_0'].status|default('') %}
    {% set hub = printer['filament_switch_sensor hub_detect'].filament_detected|default(true) %}
    {% set busy = printer['ace_preload_guard'].path_busy|default(true) %}

    {% if sv.ace_dryroll_active|default(0)|int == 0 %}
        RESPOND MSG="[DRYROLL] inactive"
    {% elif printer['gcode_macro ACE_AUDIT'].ok|int == 0 %}
        # Never move filament from a state that does not add up. Retry rather than abort:
        # a transient (a swap in flight) clears itself, and a real fault needs a human.
        RESPOND MSG="[DRYROLL] holding - state is not coherent: {printer['gcode_macro ACE_AUDIT'].why}"
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION={v.retry}
    {% elif printing and v.allow_printing|int == 0 %}
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION={v.interval}
    {% elif printing and busy %}
        # A toolchange owns the shared path. Come back soon rather than queue behind it.
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION=30
    {% elif dev != 'ready' %}
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION=30
    {% else %}
        # A lane that has left its park is no longer where we think it is.
        {% set ns = namespace(cal=-1, invalidated=false) %}
        {% for t in range(4) %}
            {% if dat[t]|int == 1 and lanepos[t] != 'parked' %}
                {% set _ = dat.__setitem__(t, 0) %}
                {% set _ = pos.__setitem__(t, 0) %}
                {% set ns.invalidated = true %}
                RESPOND MSG="[DRYROLL] T{t} datum dropped - lane moved to '{lanepos[t]}'"
            {% endif %}
        {% endfor %}
        {% if ns.invalidated %}
            SAVE_VARIABLE VARIABLE=ace_dryroll_datum VALUE="{dat}"
            SAVE_VARIABLE VARIABLE=ace_dryroll_pos VALUE="{pos}"
        {% endif %}

        # A lane that has spent its attempts without parking is retired rather than
        # retried forever -- the probe is ~1800mm and something is wrong with the lane.
        {% set ns2 = namespace(retired=false) %}
        {% for t in range(4) %}
            {% if modes[t] == 'sweep' and dat[t]|int == 0 and try[t]|int >= 2 %}
                {% set _ = modes.__setitem__(t, 'off') %}
                {% set ns2.retired = true %}
                RESPOND MSG="[DRYROLL] T{t} could not be calibrated in {try[t]} attempts - mode set to off. Fix the lane, then ACE_DRYROLL_MODE T={t} MODE=sweep"
            {% endif %}
        {% endfor %}
        {% if ns2.retired %}
            SAVE_VARIABLE VARIABLE=ace_dryroll_mode VALUE="{modes}"
        {% endif %}

        # Phase 1 - does any sweep lane still need its datum?
        {% for t in range(4) %}
            {% if ns.cal < 0 and modes[t] == 'sweep' and dat[t]|int == 0
                  and res[t]|int == 0 and not printing
                  and try[t]|int < 2
                  and printer['ace_instance_0'].slots[t].status|default('') == 'ready'
                  and t != cur %}
                {% set ns.cal = t %}
            {% endif %}
        {% endfor %}

        {% if ns.cal >= 0 %}
            {% if hub %}
                RESPOND MSG="[DRYROLL] T{ns.cal} waiting to calibrate - hub is occupied"
                UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION={v.retry}
            {% elif busy %}
                RESPOND MSG="[DRYROLL] T{ns.cal} waiting to calibrate - shared path busy"
                UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION={v.retry}
            {% else %}
                RESPOND MSG="[DRYROLL] T{ns.cal} calibrating now (hub free, printer idle)"
                {% set _ = try.__setitem__(ns.cal, try[ns.cal]|int + 1) %}
                SAVE_VARIABLE VARIABLE=ace_dryroll_try VALUE="{try}"
                # Armed BEFORE the long call: ACE_LANE_NORMALIZE raises if it never finds the
                # hub, which aborts this macro. Without a tick already queued the roller would
                # die silently. _ACE_DRYROLL_MARK re-arms at 5s on success.
                UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION=240
                ACE_LANE_NORMALIZE T={ns.cal}
                _ACE_DRYROLL_MARK T={ns.cal}
            {% endif %}
        {% else %}
            # Phase 2 - everything eligible rolls.
            {% for t in range(4) %}
                {% set mode = modes[t] %}
                {% set slot = printer['ace_instance_0'].slots[t].status|default('') %}
                {% set leg_mm = v.leg_printing|int if printing else v.leg|int %}
                {% if res[t]|int == 1 %}
                    {% if not printing %}
                        RESPOND MSG="[DRYROLL] T{t} reserved for the current job - not rolling"
                    {% endif %}
                {% elif mode != 'off' and t != cur and lanepos[t] != 'toolhead' %}

                    {% if mode == 'spin' %}
                        {% if slot == 'empty' %}
                            ACE_RAW_FEED T={t} MODE=1 LENGTH={leg_mm} SPEED={v.speed}
                        {% else %}
                            RESPOND MSG="[DRYROLL] T{t} spin SKIPPED - slot is '{slot}', not 'empty' (filament is threaded)"
                        {% endif %}

                    {% elif mode == 'sweep' %}
                        {% if slot != 'ready' %}
                            RESPOND MSG="[DRYROLL] T{t} sweep skipped - slot is '{slot}'"
                        {% elif lanepos[t] != 'parked' %}
                            RESPOND MSG="[DRYROLL] T{t} sweep skipped - lane is '{lanepos[t]}', not parked"
                        {% else %}
                            # Travel is entirely on the ACE side of park, so pos stays in
                            # [-range, 0] and the hub is never approached.
                            {% set d = dir[t]|int %}
                            {% set p = pos[t]|int %}
                            {% set bound = rng[t]|int if rng[t]|int > 0 else v.default_range|int %}
                            {% set room = (bound + p) if d < 0 else (0 - p) %}
                            {% set leg = [leg_mm, room]|min %}
                            {% if leg <= 0 %}
                                {% set _ = dir.__setitem__(t, 0 - d) %}
                                SAVE_VARIABLE VARIABLE=ace_dryroll_dir VALUE="{dir}"
                            {% else %}
                                ACE_RAW_FEED T={t} MODE={1 if d < 0 else 0} LENGTH={leg} SPEED={v.speed}
                                {% set _ = pos.__setitem__(t, p + (leg * d)) %}
                                SAVE_VARIABLE VARIABLE=ace_dryroll_pos VALUE="{pos}"
                            {% endif %}
                        {% endif %}
                    {% endif %}

                {% endif %}
            {% endfor %}
            UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION={v.interval}
        {% endif %}
    {% endif %}

[gcode_macro _ACE_DRYROLL_MARK]
description: Internal. Record that a lane's park is sensor-defined and ready to sweep from.
gcode:
    {% set t = params.T|int %}
    {% set sv = printer.save_variables.variables %}
    {% set lanepos = sv.ace_lane_pos|default(['','','','']) %}
    {% set v = printer['gcode_macro _ACE_DRYROLL_VARS'] %}
    {% if lanepos[t] != 'parked' %}
        RESPOND MSG="[DRYROLL] T{t} calibration did NOT park the lane (state '{lanepos[t]}') - staying inert"
    {% else %}
        {% set dat = sv.ace_dryroll_datum|default([0,0,0,0]) %}
        {% set pos = sv.ace_dryroll_pos|default([0,0,0,0]) %}
        {% set dir = sv.ace_dryroll_dir|default([1,1,1,1]) %}
        {% set rng = sv.ace_dryroll_range|default([0,0,0,0]) %}
        {% set _ = dat.__setitem__(t, 1) %}
        {% set _ = pos.__setitem__(t, 0) %}
        {% set _ = dir.__setitem__(t, -1) %}
        SAVE_VARIABLE VARIABLE=ace_dryroll_datum VALUE="{dat}"
        SAVE_VARIABLE VARIABLE=ace_dryroll_pos VALUE="{pos}"
        SAVE_VARIABLE VARIABLE=ace_dryroll_dir VALUE="{dir}"
        {% set try = sv.ace_dryroll_try|default([0,0,0,0]) %}
        {% set _ = try.__setitem__(t, 0) %}
        SAVE_VARIABLE VARIABLE=ace_dryroll_try VALUE="{try}"
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_TICK DURATION=5
        RESPOND MSG="[DRYROLL] T{t} calibrated - park is sensor-defined, sweeping {rng[t] if rng[t]|int > 0 else v.default_range}mm on the ACE side"
    {% endif %}

[delayed_gcode _ACE_DRYROLL_TICK]
gcode:
    _ACE_DRYROLL_TICK

# --------------------------------------------------------------------------------------
# Optional: refine the sweep bound
# --------------------------------------------------------------------------------------
# The default range is conservative. This measures the real one by stepping back toward the
# ACE gate and stopping at the LAST step where the lane still reports filament present. It
# never crosses the gate sensor: crossing and returning produces the 0->1 INSERT edge that
# triggers the firmware's autonomous ~1700 mm preload toward the hub.

[gcode_macro ACE_LANE_RANGE]
description: Measure the true ACE-side travel for a lane, refining the default. T=<0-3>
gcode:
    {% set t = params.T|int %}
    {% set v = printer['gcode_macro _ACE_DRYROLL_VARS'] %}
    {% set slot = printer['ace_instance_0'].slots[t].status|default('') %}
    {% if printer.print_stats.state == 'printing' %}
        RESPOND TYPE=error MSG="[DRYROLL] not while printing"
    {% elif printer['ace'].current_index|default(-1)|int == t %}
        RESPOND TYPE=error MSG="[DRYROLL] T{t} is the loaded tool"
    {% elif slot != 'ready' %}
        RESPOND TYPE=error MSG="[DRYROLL] T{t} slot is '{slot}', need 'ready'"
    {% elif (printer.save_variables.variables.ace_dryroll_datum|default([0,0,0,0]))[t]|int == 0 %}
        RESPOND TYPE=error MSG="[DRYROLL] T{t} is not calibrated - run ACE_DRYROLL_START, or ACE_LANE_NORMALIZE T={t} with the hub free"
    {% else %}
        RESPOND MSG="[DRYROLL] measuring T{t}: stepping back {v.step}mm at a time, stopping before the gate"
        SET_GCODE_VARIABLE MACRO=_ACE_DRYROLL_CAL VARIABLE=lane VALUE={t}
        SET_GCODE_VARIABLE MACRO=_ACE_DRYROLL_CAL VARIABLE=travelled VALUE=0
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_CAL DURATION=0.2
    {% endif %}

[gcode_macro _ACE_DRYROLL_CAL]
description: Internal. One range probe step.
variable_lane: 0
variable_travelled: 0
gcode:
    {% set v = printer['gcode_macro _ACE_DRYROLL_VARS'] %}
    {% set t = lane|int %}
    {% set slot = printer['ace_instance_0'].slots[t].status|default('') %}
    {% set dev = printer['ace_instance_0'].status|default('') %}
    {% if slot == 'empty' %}
        # Just crossed the gate. Give the whole distance back in ONE move so the 0->1 edge
        # lands mid-feed while the slot reads 'feeding' - the preload trigger requires
        # 'ready', so this cannot start an autonomous 1700 mm feed.
        RESPOND MSG="[DRYROLL] T{t} gate reached at {travelled}mm - restoring"
        ACE_RAW_FEED T={t} MODE=0 LENGTH={travelled} SPEED={v.speed}
        {% set rng = printer.save_variables.variables.ace_dryroll_range|default([0,0,0,0]) %}
        {% set usable = [(travelled|int - v.step|int - v.margin|int), 0]|max %}
        {% set _ = rng.__setitem__(t, usable) %}
        SAVE_VARIABLE VARIABLE=ace_dryroll_range VALUE="{rng}"
        RESPOND MSG="[DRYROLL] T{t} usable range = {usable}mm (gate at ~{travelled}mm, margin {v.margin}mm)"
    {% elif travelled|int >= v.cap|int %}
        RESPOND MSG="[DRYROLL] T{t} reached the {v.cap}mm cap without finding the gate - restoring"
        ACE_RAW_FEED T={t} MODE=0 LENGTH={travelled} SPEED={v.speed}
        {% set rng = printer.save_variables.variables.ace_dryroll_range|default([0,0,0,0]) %}
        {% set _ = rng.__setitem__(t, (v.cap|int - v.margin|int)) %}
        SAVE_VARIABLE VARIABLE=ace_dryroll_range VALUE="{rng}"
        RESPOND MSG="[DRYROLL] T{t} usable range = {v.cap|int - v.margin|int}mm (capped, gate not reached)"
    {% elif dev != 'ready' or slot != 'ready' %}
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_CAL DURATION=0.5
    {% else %}
        ACE_RAW_FEED T={t} MODE=1 LENGTH={v.step} SPEED={v.speed}
        SET_GCODE_VARIABLE MACRO=_ACE_DRYROLL_CAL VARIABLE=travelled VALUE={travelled|int + v.step|int}
        UPDATE_DELAYED_GCODE ID=_ACE_DRYROLL_CAL DURATION={(v.step|float / v.speed|float) + 0.8}
    {% endif %}

[delayed_gcode _ACE_DRYROLL_CAL]
gcode:
    _ACE_DRYROLL_CAL
