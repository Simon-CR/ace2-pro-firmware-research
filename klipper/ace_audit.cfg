# ACE 2 Pro — state audit
#
# SENSORS FIRST, FLAGS SECOND. Every filament routine should open with this. Flags are written
# by macros and can lie; switches cannot. The entry/post-gear pair is a truth table, not two
# independent booleans, and it is the only thing that says where filament actually is.
#
#   entry post
#     0    0    EMPTY     nothing in the toolhead
#     1    0    PARTIAL   at entry, not through the gears
#     1    1    LOADED    through the gears, melt zone reachable
#     0    1    ANOMALY   past the gears but not at entry - stub in the nip, or a sensor fault
#
# ACE_AUDIT           report, and set .ok / .why for a caller to branch on
# ACE_AUDIT STRICT=1  same, but RAISE on any contradiction so the calling routine aborts
# ACE_AUDIT QUIET=1   set the variables without printing the report
#
# A routine that moves filament calls `ACE_AUDIT STRICT=1` first. A background loop that must
# not die calls plain `ACE_AUDIT` and checks printer['gcode_macro ACE_AUDIT'].ok itself.

[gcode_macro ACE_AUDIT]
description: Sensor-first state audit. [STRICT=1 to abort the caller] [QUIET=1]
variable_ok: 1
variable_why: ''
variable_toolhead: ''
gcode:
    {% set strict = params.STRICT|default(0)|int %}
    {% set quiet  = params.QUIET|default(0)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set entry = printer['filament_switch_sensor toolhead_entry'].filament_detected|default(false) %}
    {% set post  = printer['filament_switch_sensor toolhead_postgear'].filament_detected|default(false) %}
    {% set hub   = printer['filament_switch_sensor hub_detect'].filament_detected|default(false) %}
    {% set inst  = printer['ace_instance_0'] %}
    {% set cur   = printer['ace'].current_index|default(-1)|int %}
    {% set hot   = sv.filament_loaded_hot|default(0)|int %}
    {% set parked = sv.filament_parked|default(0)|int %}
    {% set lanepos = sv.ace_lane_pos|default(['','','','']) %}
    {% set fpos = sv.ace_filament_pos|default('') %}
    {% set drpos = sv.ace_dryroll_pos|default([0,0,0,0]) %}
    {% set staged = printer['ace_preload_guard'].staged|default({}) %}

    {% set th = 'EMPTY' if not entry and not post
           else 'PARTIAL' if entry and not post
           else 'LOADED' if entry and post
           else 'ANOMALY' %}
    {% set ns = namespace(bad=[]) %}

    # The truth table itself
    {% if th == 'ANOMALY' %}
        {% set ns.bad = ns.bad + ['post-gear reads filament but entry does not: a stub is in the nip, or a sensor has failed'] %}
    {% endif %}

    # Flags must agree with the switches
    {% if hot == 1 and th != 'LOADED' %}
        {% set ns.bad = ns.bad + ['hot=1 (melt zone engaged) but toolhead reads ' ~ th] %}
    {% endif %}
    {% if parked == 1 and th != 'EMPTY' %}
        {% set ns.bad = ns.bad + ['parked=1 but toolhead reads ' ~ th] %}
    {% endif %}
    {% if hot == 0 and parked == 0 and th != 'EMPTY' %}
        {% set ns.bad = ns.bad + ['state says UNLOADED/EMPTY but toolhead reads ' ~ th] %}
    {% endif %}

    # Ownership: filament in the path must belong to a recorded lane
    {% if cur >= 0 and th == 'EMPTY' %}
        {% set ns.bad = ns.bad + ['current_index=' ~ cur ~ ' claims a loaded tool but the toolhead is empty'] %}
    {% endif %}
    {% if cur < 0 and th != 'EMPTY' %}
        {% set ns.bad = ns.bad + ['toolhead holds filament but NO lane is recorded (current_index=-1) - whose strand it is, is unknown'] %}
    {% endif %}
    {% if hub and cur < 0 and staged|length == 0 %}
        {% set ns.bad = ns.bad + ['hub_detect reads filament but no lane is loaded or staged - unowned filament in the shared path'] %}
    {% endif %}
    # 'bowden' is the driver's UNLOADED state (tip retracted to park, path free) - not a fault.
    # Only splitter/toolhead/nozzle assert filament in the shared path, and those need an owner.
    {% if fpos in ['splitter','toolhead','nozzle'] and cur < 0 and not hub and th == 'EMPTY' %}
        {% set ns.bad = ns.bad + ["ace_filament_pos='" ~ fpos ~ "' asserts filament in the path but every sensor is clear and no lane is loaded - stale"] %}
    {% endif %}
    {% if fpos == 'nozzle' and hot == 0 %}
        {% set ns.bad = ns.bad + ["ace_filament_pos='nozzle' but hot=0 - the melt zone flag never committed"] %}
    {% endif %}

    # Per-lane coherence
    {% for t in range(4) %}
        {% set st = inst.slots[t].status|default('?') %}
        {% if lanepos[t] == 'parked' and st != 'ready' %}
            {% set ns.bad = ns.bad + ['lane ' ~ t ~ " says 'parked' but its slot reads '" ~ st ~ "'"] %}
        {% endif %}
        {% if lanepos[t] == 'toolhead' and cur != t %}
            {% set ns.bad = ns.bad + ['lane ' ~ t ~ " says 'toolhead' but current_index=" ~ cur] %}
        {% endif %}
        # A swept lane is off its park datum even though lane_pos still says 'parked'.
        {% if drpos[t]|int != 0 and lanepos[t] == 'parked' %}
            {% set ns.bad = ns.bad + ['lane ' ~ t ~ ' is ' ~ (0 - drpos[t]|int) ~ 'mm off its park datum from drying rotation - park it before loading'] %}
        {% endif %}
    {% endfor %}

    # An operation that never committed leaves the state indeterminate
    {% if sv.ace_op %}
        {% set ns.bad = ns.bad + ['OPEN INTENT: ' ~ sv.ace_op ~ ' never committed - state is indeterminate, recover before moving filament'] %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=ACE_AUDIT VARIABLE=toolhead VALUE="'{th}'"
    SET_GCODE_VARIABLE MACRO=ACE_AUDIT VARIABLE=ok VALUE={0 if ns.bad else 1}
    SET_GCODE_VARIABLE MACRO=ACE_AUDIT VARIABLE=why VALUE="'{ns.bad|join(' | ')|replace("'","")}'"

    {% if not quiet %}
        RESPOND MSG="[AUDIT] toolhead={th} (entry={entry} post={post})  hub={hub}  current_index={cur}  hot={hot} parked={parked}"
        RESPOND MSG="[AUDIT] slots={inst.slots[0].status}/{inst.slots[1].status}/{inst.slots[2].status}/{inst.slots[3].status}  lane_pos={lanepos}  staged={staged}"
        {% if ns.bad %}
            {% for b in ns.bad %}
                RESPOND TYPE=error MSG="[AUDIT] !! {b}"
            {% endfor %}
        {% else %}
            RESPOND MSG="[AUDIT] no contradictions"
        {% endif %}
    {% endif %}

    {% if strict and ns.bad %}
        { action_raise_error("ACE_AUDIT: state is not coherent - " ~ ns.bad|join(' | ')) }
    {% endif %}
